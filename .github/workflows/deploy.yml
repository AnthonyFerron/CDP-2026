name: Déployer

on:
  push:
    branches: [main]
    paths:
      - backend/**
      - infrastructure/**
      - frontend/**
      - LICENCES.md
      - .github/workflows/deploy.yml
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Mêmes tests que sur les pull requests : un échec bloque le déploiement
  test:
    uses: ./.github/workflows/tests.yml

  deploy:
    needs: test
    # Jamais depuis une autre branche, même lancé à la main : seul main est déployé
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Préparer la connexion SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519

      # La clé est limitée côté serveur à l'exécution de cdp-deploy, qui sauvegarde la base et applique
      # les migrations avant de mettre l'API à jour (infrastructure/deploy.sh)
      - name: Déployer
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: ssh -o BatchMode=yes "deploy@$DEPLOY_HOST"
