name: Tests de l'API

# Tests du backend sur chaque pull request vers dev ou main, et avant chaque déploiement (appelé par
# deploy.yml). Ce workflow ne déploie rien et n'utilise aucun secret.
on:
  pull_request:
    branches: [dev, main]
  workflow_call:

permissions:
  contents: read

jobs:
  backend:
    name: Tests du backend
    runs-on: ubuntu-latest

    # Base jetable pour les tests d'API, recréée à chaque exécution
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: test_user
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: escape_game_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test_user -d escape_game_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql+psycopg://test_user:test_password@localhost:5432/escape_game_test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt

      - name: Installer les dépendances
        working-directory: backend
        run: pip install -r requirements.txt -r requirements-dev.txt

      # Sans base, les tests d'API échouent en CI au lieu d'être ignorés (voir tests/conftest.py)
      - name: Lancer les tests
        working-directory: backend
        run: python -m pytest -ra
