name: cdp2026

services:
  db:
    image: postgres:17
    restart: unless-stopped

    environment:
      POSTGRES_USER: escape_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: escape_game

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escape_user -d escape_game"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: ../backend
    restart: unless-stopped

    labels:
      # Défini par infrastructure/deploy.sh, qui sauvegarde la base et applique les migrations avant de
      # mettre l'API à jour. Sans lui, un cdp-deploy trop ancien échoue ici, avant de toucher aux
      # conteneurs. Pour une commande manuelle : CDP_DEPLOY=manuel docker compose ...
      fr.cdp2026.deploy: "${CDP_DEPLOY:?lancer le deploiement avec infrastructure/deploy.sh, qui applique les migrations}"

    environment:
      DATABASE_URL: postgresql+psycopg://escape_user:${POSTGRES_PASSWORD:?}@db:5432/escape_game
      # Facultatifs : sans eux l'API démarre, mais la connexion 2FA ne peut pas envoyer de code
      SECRET_KEY: ${SECRET_KEY:-}
      EMAIL_BACKEND: ${EMAIL_BACKEND:-smtp}
      EMAIL_FROM: ${EMAIL_FROM:-CodeQuest <no-reply@localhost>}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}

    depends_on:
      db:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/database', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  caddy:
    build:
      context: ..
      dockerfile: frontend/Dockerfile
    restart: unless-stopped

    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:?}

    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"

    volumes:
      - caddy_data:/data
      - caddy_config:/config

    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  caddy_data:
  caddy_config:
