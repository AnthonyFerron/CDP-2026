services:
  db:
    image: postgres:17
    container_name: cdp2026-postgres
    restart: unless-stopped

    environment:
      POSTGRES_USER: escape_user
      POSTGRES_PASSWORD: escape_dev_password
      POSTGRES_DB: escape_game

    ports:
      - "127.0.0.1:5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U escape_user -d escape_game"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: